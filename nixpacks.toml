[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
  "composer install --ignore-platform-reqs --no-dev --optimize-autoloader --no-interaction",
  "npm ci --omit=dev || npm install"
]

[phases.build]
cmds = [
  "npm run build || true"
]

[start]
cmd = "touch database/database.sqlite && php artisan storage:link || true && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
